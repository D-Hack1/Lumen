selection_ladders:
  cy3_shiv_shakti:
    site_id: "cy3_shiv_shakti"
    order:
      - chandrayaan3_lroc_vikramsite_dtm
      - polar_60m_lola_pgda_90
      - regional_240m_lola_pgda_90
    active_source: null
    rule: >
      Use the LROC DTM only after its pixel data, confidence map, frame and
      vertical reference pass verification. Otherwise use the 60 m PGDA-90
      source for the regional mid-field and the 240 m source for far-field.
      Do not select the 30 m 75S product; its footprint does not cover CY-3.
      Record the actual source used for each crop.

  shackleton_ridge:
    site_id: "shackleton_ridge"
    order:
      - polar_10m_lola_pgda_90
      - polar_20m_lola_pgda_90
      - regional_240m_lola_pgda_90
    active_source: null
    rule: >
      Use the first source that passes frame, datum, coverage and processing
      verification for the relevant crop. The 10 m DEM and matching ERR
      window have been read successfully. The 20 m and 240 m fallback DEM
      and ERR windows have also been read successfully. Formal vertical-datum
      confirmation remains outstanding. Record the actual source used for
      each crop; do not report a preferred source as active unless it was
      obtained and processed.
