
# Owner: Shiva Shakthi
# Verified DEM products and source-selection metadata.
#
# PGDA-90 elevations are stored in metres following the documented
# kilometre-to-metre conversion. The height_relative convention is used
# provisionally against the 1,737,400 m lunar reference sphere.
# Formal vertical-datum confirmation remains outstanding.

schema_version: "0.1.0"

products:
  polar_5m_lola_pgda_81:
    name: "Polar 5 m LOLA 87-90S mosaic"
    provider: "PGDA"
    product_id: 81
    source_page: "https://pgda.gsfc.nasa.gov/products/81"
    resolution_m: 5.0
    latitude_coverage: "87S-90S"
    format: "GeoTIFF"
    dem_url: "https://pgda.gsfc.nasa.gov/data/LOLA_5mpp/87S/ldem_87s_5mpp.tif"
    slope_url: "https://pgda.gsfc.nasa.gov/data/LOLA_5mpp/87S/ldsm_87s_5mpp.tif"
    error_url: null
    frame: null
    datum_reference: null
    availability_status: "verified_product"
    verification_status: "source_page_and_urls_provided"
    notes: >
      Do not classify as COG without verification. No _ERR URL is claimed.
      The mosaic contains interpolated fill; nominal pixel spacing does not
      establish uniform direct LOLA observation support.

  site_specific_5m_lola_pgda_78:
    name: "Site-specific 5 m LOLA products"
    provider: "PGDA"
    product_id: 78
    source_page: "https://pgda.gsfc.nasa.gov/products/78"
    resolution_m: 5.0
    latitude_coverage: "site-specific"
    format: "GeoTIFF"
    dem_url: null
    slope_url: null
    error_url: null
    frame: null
    datum_reference: null
    availability_status: "catalogue_product"
    verification_status: "site_urls_pending_selection"
    product_semantics:
      surface_dem: true
      slope: true
      total_z_uncertainty: true
      slope_uncertainty: true
      clone_count: 100
    notes: >
      Register exact site product URLs only after confirming coverage of the
      intended site. Product 78 supplies total Z uncertainty and clone
      products; do not invent an _ERR URL. The inspected Site04 and Site07
      products do not cover the current Shackleton Ridge coordinates.

  polar_10m_lola_pgda_90:
    name: "Polar 10 m LOLA 83-90S mosaic"
    provider: "PGDA"
    product_id: 90
    source_page: "https://pgda.gsfc.nasa.gov/products/90"
    resolution_m: 10.0
    latitude_coverage: "83S-90S"
    format: "GeoTIFF"
    dem_url: "https://pgda.gsfc.nasa.gov/data/LOLA_20mpp/LDEM_83S_10MPP_ADJ.TIF"
    error_url: "https://pgda.gsfc.nasa.gov/data/LOLA_20mpp/LDEM_83S_10MPP_ADJ_ERR.TIF"
    slope_url: null
    frame: "MOON_ME / DE421"
    datum_reference: "1737400 m reference sphere"
    unit: "m"
    scale: 1.0
    offset: 0.0
    nodata: .nan
    vertical_reference: "height_relative"
    error_unit: "m"
    error_scale: 1.0
    error_offset: 0.0
    error_nodata: .nan
    error_vertical_reference: "height_relative"
    format_metadata:
      cog: true
      elevation_unit: "m"
      coordinate_system: "south-polar stereographic"
    availability_status: "verified_product"
    verification_status: "source_page_and_urls_provided"
    notes: >
      DEM and matching ERR grids were inspected. CRS, transform, dimensions,
      resolution and nodata match. DEM history records kilometre-to-metre
      conversion. Shackleton radial coverage and a 5 km DemReader window
      were verified, including a successful matching ERR read. Error values
      are uncertainty magnitudes; no sphere subtraction is applied to them.
      Effective LOLA support is not uniform across the nominal 10 m grid.
      Shackleton count-map inspection showed approximately 34 percent
      directly supported pixels in the near-field crop. Formal vertical-datum
      confirmation remains outstanding.

