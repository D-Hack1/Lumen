  chandrayaan3_lroc_vikramsite_dtm:
    name: "LROC pre-landing Vikram-site DTM"
    provider: "LROC"
    resolution_m: 3.0
    latitude_coverage: "Vikram landing site"
    format: "GeoTIFF"
    dem_url: "https://pds.mcp.nasa.gov/data/store/img/lunar_reconnaissance_orbiter/pds4/lroc/lro-l-lroc-5-rdr/LROLRC_2001/DATA/SDP/NAC_DTM/VIKRAMSITE1/NAC_DTM_VIKRAMSITE1.TIF"
