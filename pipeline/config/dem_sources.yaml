      - polar_10m_lola_pgda_90
      - polar_20m_lola_pgda_90
      - regional_240m_lola_pgda_90
    active_source: null
    rule: >
      Use the first source that passes frame, datum, coverage, and processing
      verification. Record the actual selected source.
