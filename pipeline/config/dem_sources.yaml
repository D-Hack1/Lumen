selection_ladders:
  chandrayaan3_statio_shiv_shakti:
    site_id: "statio_shiv_shakti"
    order:
      - chandrayaan3_lroc_vikramsite_dtm
      - regional_240m_lola_pgda_90
    active_source: null
    rule: >
      Preserve this order. The first source that is obtained and passes frame,
      datum, coverage, and processing verification is selected. Record the
      actual selected source; do not report the preferred source unless it was
      obtained and processed.

  shackleton_ridge:
