    slope_url: null
    source_page: "https://data.lroc.im-ldi.com/lroc/view_rdr/NAC_DTM_VIKRAMSITE1"
    frame: null
    datum_reference: null
    availability_status: "candidate"
    verification_status: "frame_and_datum_pending"
    notes: >
      PDS labels establish the lunar polar stereographic map geometry and
      elevation band, but do not establish the elevation unit or vertical
      reference. Remote pixel reads were blocked by read failures and HTTP
      rate limiting. Do not activate until data access, confidence coverage,
      frame and vertical reference are verified.

