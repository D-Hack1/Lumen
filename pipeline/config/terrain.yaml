# Owner: Shiva Shakthi
# Terrain pipeline configuration.
# Unresolved values are explicit nulls; they must not receive silent defaults.

schema_version: "0.1.0"

tier_a:
  horizon_mask:
    bin_width_deg: 0.1
    azimuth_bin_count: 3600
    observer_heights_m: [1.0, 2.0, 5.0, 10.0]
    max_ray_range_km: 250.0
    output_provenance:
      record_near_field_resolution_m: true
      record_selected_dem_source: true

  dem_selection:
    ranges:
      near:
        max_distance_km: 5.0
        preferred_resolution_m: 5.0
        source_keys:
          - site_specific_5m_lola_pgda_78
          - polar_5m_lola_pgda_81
        coverage_condition: "where covered"
      mid:
        max_distance_km: 80.0
        preferred_resolution_m: 20.0
        source_keys:
          - polar_20m_lola_pgda_90
      far:
        min_distance_km: 80.0
        max_distance_km: 250.0
        preferred_resolution_m: 240.0
        source_keys:
          - regional_240m_lola_pgda_90

  raycaster:
    start_dem_marching_at_d_min: true
    d_min_rule: "3 * near_field_pixel_size_m"
    d_min_by_resolution_m:
      "5": 15.0
      "20": 60.0
      "240": 720.0
    initial_ray_step_rule: "0.5 * near_field_pixel_size_m"
    geometric_step_growth: true
    geometric_growth_factor: null # Unresolved; do not choose an arbitrary value.
    geometry: "exact_3d"
    site_frame_provider: "Gowri"
    site_frame_convention: null # Defined by the shared site-frame implementation.

  near_field:
    median_filter:
      kernel_px: [3, 3]
      region_radius_m: 100.0
      apply_before_raycast: true
    plane_fit:
      k: 3
      window_px: [7, 7]
      fit_window_half_width_rule: "3 * near_field_pixel_size_m"
      fit_window_span_rule: "7 * near_field_pixel_size_m"
      outer_pixel_centre_baseline_rule: "6 * near_field_pixel_size_m"
      observer_ground_height: "fitted_plane_z0_m"
      source: "finest_available_dem"
      same_plane_for:
        - slope
        - downhill_aspect
        - z0
        - near_zone_occluder
      by_resolution:
        "5":
          d_min_m: 15.0
          fit_window_span_m: 35.0
          outer_pixel_centre_baseline_m: 30.0
        "20":
          d_min_m: 60.0
          fit_window_span_m: 140.0
          outer_pixel_centre_baseline_m: 120.0
        "240":
          d_min_m: 720.0
          fit_window_span_m: 1680.0
          outer_pixel_centre_baseline_m: 1440.0
    nominal_lander_footprint_m: null # Approximately 5-6 m; not a plane baseline.
    reported_plane_fit_baseline_rule: "6 * near_field_pixel_size_m"

tier_b:
  coverage: "80S-90S"
  grid:
    bin_width_deg: 0.5
    azimuth_bin_count: 720
    observer_height_m: 1.0
    tile_size_km: 20.0
    node_spacing:
      inside_85S_km: 2.0
      from_80S_to_85S_km: 4.0
    boundary_85S_ownership: null # Unresolved.
    exact_grid_alignment: null # Unresolved.
  quantization:
    dtype: "UInt8"
    degrees_per_step: 0.05
    offset_deg: null # Unresolved; do not infer from dtype or range.
  node_plane_fit:
    k: 3
    window_px: [7, 7]
    source: "finest_available_dem"
    fields:
      - slope_deg
      - downhill_aspect_deg
      - z0_m

dispersion:
  grid:
    node_count: [11, 11]
    node_spacing_m: 50.0
    radius_m: null # Unresolved; no authoritative value is specified.
    origin: null # Unresolved; site-centre alignment is not encoded here.
    node_offsets: null # Unresolved; exact offsets and ordering require approval.
  horizon:
    bin_width_deg: 0.5
    azimuth_bin_count: 720
    observer_height_m: 1.0
  node_fields:
    - slope_deg
    - downhill_aspect_deg

uncertainty:
  monte_carlo:
    target: "Tier-A centre points"
    clone_count_min: 20
    clone_count_max: 30
    clone_count: null # Unresolved within the authoritative 20-30 range.
    error_source_priority:
      - "_ERR raster"
      - "PGDA-provided clones"

pad_statistics:
  nominal_lander_footprint_m: null # Approximately 5-6 m; distinct from plane baseline.
  slope_tolerance_deg: null # Unresolved; no confirmed numeric default.
  dispersion_radius_m: null # Unresolved; no authoritative numeric default.
